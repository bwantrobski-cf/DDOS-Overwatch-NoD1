name = "ddos-overwatch"
main = "src/index.js"
compatibility_date = "2026-04-08"
workers_dev = false
preview_urls = false


[vars]
ACCOUNT_ID = "YOUR_CLOUDFLARE_ACCOUNT_ID"

# Set API_BEARER as an encrypted Worker secret:
# npx wrangler secret put API_BEARER

[observability]
[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true
